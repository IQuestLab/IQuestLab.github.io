<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Pixel Runner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        
        body {
            font-family: 'VT323', monospace;
            background-color: #0f0f1a;
            overflow: hidden;
            user-select: none;
        }

        /* CRT Scanline Effect */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 50;
        }

        .glow-text {
            text-shadow: 0 0 10px currentColor;
        }

        canvas {
            image-rendering: pixelated; /* Critical for pixel art look */
        }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center relative text-white">

    <!-- Game Container -->
    <div id="game-container" class="relative w-full max-w-4xl aspect-video bg-black shadow-2xl border-4 border-slate-800 rounded-lg overflow-hidden">
        
        <!-- Canvas -->
        <canvas id="gameCanvas" class="block w-full h-full"></canvas>

        <!-- Scanline Overlay -->
        <div class="scanlines"></div>

        <!-- UI HUD -->
        <div id="hud" class="absolute top-4 left-4 right-4 flex justify-between items-start pointer-events-none hidden z-40">
            <div class="text-2xl text-cyan-400 glow-text">SCORE: <span id="scoreDisplay">0</span></div>
            <div class="text-xl text-yellow-400 glow-text">SPEED: <span id="speedDisplay">1.0x</span></div>
        </div>

        <!-- Start Screen -->
        <div id="startScreen" class="absolute inset-0 flex flex-col items-center justify-center bg-black/80 z-50 backdrop-blur-sm">
            <h1 class="text-6xl md:text-8xl mb-2 text-transparent bg-clip-text bg-gradient-to-b from-cyan-300 to-blue-600" style="filter: drop-shadow(0 0 10px rgba(34,211,238,0.6))">NEON RUNNER</h1>
            <p class="text-xl text-slate-300 mb-8 animate-pulse">Press [SPACE] or [UP] to Jump</p>
            <button id="startBtn" class="px-8 py-3 bg-cyan-600 hover:bg-cyan-500 text-white text-2xl rounded shadow-[0_0_15px_rgba(8,145,178,0.7)] transition-all transform hover:scale-105 active:scale-95">
                INITIATE RUN
            </button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="absolute inset-0 flex flex-col items-center justify-center bg-red-900/90 z-50 hidden backdrop-blur-md">
            <h2 class="text-6xl text-red-500 glow-text mb-2">SYSTEM FAILURE</h2>
            <p class="text-2xl text-white mb-6">FINAL SCORE: <span id="finalScore">0</span></p>
            <button id="restartBtn" class="px-8 py-3 bg-slate-700 hover:bg-slate-600 text-white text-2xl rounded border-2 border-slate-500 shadow-lg transition-all transform hover:scale-105 active:scale-95">
                REBOOT SYSTEM
            </button>
        </div>
    </div>

    <script>
        /**
         * GAME CONFIGURATION & STATE
         */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // UI Elements
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const hud = document.getElementById('hud');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const speedDisplay = document.getElementById('speedDisplay');
        const finalScoreDisplay = document.getElementById('finalScore');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');

        // Game Constants
        let GAME_WIDTH = 800;
        let GAME_HEIGHT = 450;
        const GRAVITY = 0.5;
        const JUMP_FORCE = -12;
        const GROUND_HEIGHT = 50;

        // Game State
        let gameRunning = false;
        let frameId;
        let score = 0;
        let gameSpeed = 2.5;
        let speedMultiplier = 1;
        let distanceTraveled = 0;

        // Audio Context (Tone.js)
        let synth, noiseSynth, musicLoop;
        let audioInitialized = false;

        /**
         * AUDIO SYSTEM
         */
        async function initAudio() {
            if (audioInitialized) return;
            await Tone.start();
            
            // Jump Sound (Retro 8-bit ping)
            synth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "square" },
                envelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.1 }
            }).toDestination();
            synth.volume.value = -10;

            // Crash Sound (Noise burst)
            noiseSynth = new Tone.NoiseSynth({
                noise: { type: 'white' },
                envelope: { attack: 0.005, decay: 0.3, sustain: 0 }
            }).toDestination();

            // Background Music (Simple Arpeggio)
            const bass = new Tone.Synth({
                oscillator: { type: "sawtooth" },
                envelope: { attack: 0.01, decay: 0.2, sustain: 0.1, release: 1 }
            }).toDestination();
            bass.volume.value = -15;

            const seq = new Tone.Sequence((time, note) => {
                bass.triggerAttackRelease(note, "8n", time);
            }, ["C2", "C2", "Eb2", "C2", "F2", "C2", "G2", "Bb1"], "4n");
            
            musicLoop = seq;
            audioInitialized = true;
        }

        function playJumpSound() {
            if(audioInitialized) synth.triggerAttackRelease(["C5", "E5"], "16n");
        }

        function playCrashSound() {
            if(audioInitialized) noiseSynth.triggerAttackRelease("8n");
        }

        function startMusic() {
            if(audioInitialized) {
                Tone.Transport.start();
                musicLoop.start(0);
            }
        }

        function stopMusic() {
            if(audioInitialized) {
                musicLoop.stop();
                Tone.Transport.stop();
            }
        }

        /**
         * RESIZING
         */
        function resize() {
            const container = document.getElementById('game-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            GAME_WIDTH = canvas.width;
            GAME_HEIGHT = canvas.height;
        }
        window.addEventListener('resize', resize);
        resize();

        /**
         * INPUT HANDLING
         */
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if ((e.code === 'Space' || e.code === 'ArrowUp') && gameRunning) {
                player.jump();
            }
        });
        window.addEventListener('keyup', (e) => keys[e.code] = false);
        
        // Touch support
        window.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevent scrolling
            if (gameRunning) player.jump();
        }, {passive: false});

        /**
         * GAME ENTITIES
         */

        // Particle System for visual flair
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 5;
                this.vy = (Math.random() - 0.5) * 5;
                this.life = 1.0;
                this.color = color;
                this.size = Math.random() * 4 + 2;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.03;
            }
            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.globalAlpha = 1;
            }
        }

        let particles = [];

        // Player Class
        class Player {
            constructor() {
                this.w = 40;
                this.h = 40;
                this.x = 100;
                this.y = GAME_HEIGHT - GROUND_HEIGHT - this.h;
                this.vy = 0;
                this.color = '#22d3ee'; // Cyan
                this.isGrounded = true;
                this.runFrame = 0;
            }

            update() {
                // Gravity
                this.vy += GRAVITY;
                this.y += this.vy;

                // Ground collision
                if (this.y + this.h > GAME_HEIGHT - GROUND_HEIGHT) {
                    this.y = GAME_HEIGHT - GROUND_HEIGHT - this.h;
                    this.vy = 0;
                    this.isGrounded = true;
                } else {
                    this.isGrounded = false;
                }

                // Animation frame
                if (this.isGrounded) {
                    this.runFrame += 0.2;
                } else {
                    this.runFrame = 1; // Poised pose
                }
            }

            jump() {
                if (this.isGrounded) {
                    this.vy = JUMP_FORCE;
                    this.isGrounded = false;
                    playJumpSound();
                    
                    // Spawn jump particles
                    for(let i=0; i<5; i++) {
                        particles.push(new Particle(this.x + this.w/2, this.y + this.h, '#fff'));
                    }
                }
            }

            draw() {
                // Glow effect
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                
                // Body (Pixel Art representation using rects)
                const drawFrame = Math.floor(this.runFrame) % 4;
                
                // Main block
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.w, this.h);

                // Eye (White)
                ctx.fillStyle = '#fff';
                ctx.fillRect(this.x + 25, this.y + 8, 10, 4);

                // Pupil (Black)
                ctx.fillStyle = '#000';
                if (drawFrame === 0) ctx.fillRect(this.x + 30, this.y + 8, 4, 4);
                else if (drawFrame === 2) ctx.fillRect(this.x + 26, this.y + 8, 4, 4);
                else ctx.fillRect(this.x + 28, this.y + 8, 4, 4);

                // Headband (Red)
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(this.x - 5, this.y + 5, this.w + 10, 4);

                // Leg animation
                ctx.fillStyle = '#fff';
                ctx.fillRect(this.x + 4, this.y + 35, 12, 5);
                ctx.fillRect(this.x + 24, this.y + 35, 12, 5);

                ctx.shadowBlur = 0;
            }
        }

        // Obstacle Class
        class Obstacle {
            constructor() {
                this.w = 30 + Math.random() * 20;
                this.h = 30 + Math.random() * 30; // Random height
                this.x = GAME_WIDTH + this.w;
                this.y = GAME_HEIGHT - GROUND_HEIGHT - this.h;
                this.markedForDeletion = false;
                this.color = '#f472b6'; // Pink
            }

            update() {
                this.x -= gameSpeed;
                if (this.x + this.w < 0) this.markedForDeletion = true;
            }

            draw() {
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                
                // Draw spiky top
                ctx.beginPath();
                ctx.moveTo(this.x, this.y + this.h);
                ctx.lineTo(this.x + this.w / 2, this.y);
                ctx.lineTo(this.x + this.w, this.y + this.h);
                ctx.fill();
                
                ctx.shadowBlur = 0;
            }
        }

        // Background Layer Class
        class Layer {
            constructor(speedModifier, color, type) {
                this.speedModifier = speedModifier;
                this.color = color;
                this.type = type; // 'mountain', 'cloud', 'star'
                this.elements = [];
                this.generateInitial();
            }

            generateInitial() {
                // Generate enough elements to fill screen
                let currentX = 0;
                while(currentX < GAME_WIDTH * 2) {
                    this.addElement(currentX);
                    currentX += this.elements[this.elements.length-1].w;
                }
            }

            addElement(xPos) {
                let width, height;
                
                if (this.type === 'star') {
                    width = Math.random() * 3 + 1;
                    height = width;
                    this.elements.push({
                        x: xPos, 
                        y: Math.random() * (GAME_HEIGHT / 2), 
                        w: width, 
                        h: height 
                    });
                } else if (this.type === 'cloud') {
                    width = Math.random() * 60 + 40;
                    height = width * 0.4;
                    this.elements.push({
                        x: xPos, 
                        y: Math.random() * (GAME_HEIGHT / 2), 
                        w: width, 
                        h: height 
                    });
                } else if (this.type === 'mountain') {
                    width = Math.random() * 150 + 100;
                    height = Math.random() * 200 + 100;
                    this.elements.push({
                        x: xPos, 
                        y: GAME_HEIGHT - GROUND_HEIGHT, 
                        w: width, 
                        h: height 
                    });
                }
            }

            update() {
                const moveSpeed = gameSpeed * this.speedModifier;

                this.elements.forEach(el => {
                    el.x -= moveSpeed;
                });

                // Remove off-screen elements
                this.elements = this.elements.filter(el => el.x + el.w > -100);

                // Add new elements to keep scrolling
                if (this.elements.length === 0) {
                    this.addElement(GAME_WIDTH);
                    return;
                }
                const lastEl = this.elements[this.elements.length - 1];
                if (lastEl.x < GAME_WIDTH) {
                    this.addElement(GAME_WIDTH + (this.type === 'star' ? 0 : Math.random() * 100));
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                
                this.elements.forEach(el => {
                    if (this.type === 'mountain') {
                        // Draw triangle mountain
                        ctx.beginPath();
                        ctx.moveTo(el.x, GAME_HEIGHT - GROUND_HEIGHT);
                        ctx.lineTo(el.x + el.w / 2, GAME_HEIGHT - GROUND_HEIGHT - el.h);
                        ctx.lineTo(el.x + el.w, GAME_HEIGHT - GROUND_HEIGHT);
                        ctx.fill();
                    } else if (this.type === 'cloud') {
                        // Draw cloud rects
                        ctx.fillRect(el.x, el.y, el.w, el.h);
                        // Add some detail to cloud
                        ctx.fillStyle = 'rgba(255,255,255,0.5)';
                        ctx.fillRect(el.x + 5, el.y + 10, el.w - 10, el.h - 20);
                        ctx.fillStyle = this.color;
                    } else {
                        // Star
                        ctx.fillRect(el.x, el.y, el.w, el.h);
                    }
                });
            }
        }

        /**
         * GAME LOGIC
         */
        let player;
        let obstacles = [];
        let backgroundLayers = [];
        let obstacleTimer = 0;
        let obstacleInterval = 2000; // ms 

        function initGame() {
            player = new Player();
            obstacles = [];
            particles = [];
            score = 0;
            gameSpeed = 2.5;
            speedMultiplier = 1;
            obstacleTimer = 0;
            
            // Create Parallax Layers
            backgroundLayers = [
                new Layer(0.2, '#1e293b', 'mountain'), // Slow, dark
                new Layer(0.5, '#334155', 'mountain'), // Medium
                new Layer(0.8, '#64748b', 'cloud'),    // Faster, lighter
                new Layer(1.0, '#94a3b8', 'cloud'),    // Fastest
                new Layer(0.3, '#ffffff', 'star')      // Stars (very slow)
            ];

            scoreDisplay.innerText = '0';
            speedDisplay.innerText = '1.0x';
            
            gameRunning = true;
            animate(0);
        }

        function spawnObstacle() {
            // Randomize interval slightly
            const minInterval = 600;
            const maxInterval = 1800;
            // As speed increases, decrease interval cap
            const dynamicMax = 1800 / speedMultiplier;

            if (Math.random() < 0.05) { // Change interval frequently
                obstacleInterval = Math.random() * (Math.max(minInterval, dynamicMax) - minInterval) + minInterval;
            }
            
            if (obstacleTimer > obstacleInterval) {
                obstacles.push(new Obstacle());
                obstacleTimer = 0;
            }
        }

        function checkCollisions() {
            // AABB Collision
            // Shrink hitbox slightly for fairness
            const pMargin = 8; 
            const playerBox = {
                x: player.x + pMargin,
                y: player.y + pMargin,
                w: player.w - pMargin*2,
                h: player.h - pMargin*2
            };

            for (let obs of obstacles) {
                const obsBox = {
                    x: obs.x,
                    y: obs.y,
                    w: obs.w,
                    h: obs.h
                };

                if (playerBox.x < obsBox.x + obsBox.w &&
                    playerBox.x + playerBox.w > obsBox.x &&
                    playerBox.y < obsBox.y + obsBox.h &&
                    playerBox.y + playerBox.h > obsBox.y) {
                    
                    gameOver();
                }
            }
        }

        function gameOver() {
            gameRunning = false;
            playCrashSound();
            stopMusic();
            
            // Create explosion particles
            for(let i=0; i<30; i++) {
                particles.push(new Particle(player.x + player.w/2, player.y + player.h/2, '#22d3ee'));
                particles.push(new Particle(player.x + player.w/2, player.y + player.h/2, '#ef4444'));
            }

            // Draw one last frame to show death, then show screen
            draw(0); // Draw death scene
            
            hud.classList.add('hidden');
            gameOverScreen.classList.remove('hidden');
            finalScoreDisplay.innerText = Math.floor(score);
        }

        function drawGround() {
            // Draw neon grid floor
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, GAME_HEIGHT - GROUND_HEIGHT, GAME_WIDTH, GROUND_HEIGHT);
            
            // Moving grid lines
            ctx.strokeStyle = '#22d3ee';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 5;
            ctx.shadowColor = '#22d3ee';
            
            const gridOffset = (Date.now() / 2) % 40;
            
            // Horizontal lines
            ctx.beginPath();
            ctx.moveTo(0, GAME_HEIGHT - GROUND_HEIGHT);
            ctx.lineTo(GAME_WIDTH, GAME_HEIGHT - GROUND_HEIGHT);
            ctx.stroke();

            // Perspective lines (simple)
            for(let i=0; i<GAME_WIDTH + 40; i+=40) {
                let x = (i - gridOffset) % (GAME_WIDTH + 40) - 20;
                ctx.beginPath();
                ctx.moveTo(x, GAME_HEIGHT - GROUND_HEIGHT);
                ctx.lineTo(x - (GAME_WIDTH/2 - x)*2, GAME_HEIGHT); // Fake perspective
                ctx.stroke();
            }
            
            ctx.shadowBlur = 0;
        }

        function draw() {
            // Clear
            ctx.fillStyle = '#0f0f1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Background
            backgroundLayers.forEach(layer => {
                layer.update();
                layer.draw();
            });

            // Ground
            drawGround();

            // Entities
            player.draw();
            
            obstacles.forEach(obs => obs.draw());
            
            particles.forEach(p => {
                p.update();
                p.draw(ctx);
            });
            particles = particles.filter(p => p.life > 0);
        }

        function update(deltaTime) {
            if (!gameRunning) return;

            // Difficulty Scaling
            score += (gameSpeed * 0.01);
            speedMultiplier = 1 + (score / 3000);
            gameSpeed = 2.5 * speedMultiplier;
            
            scoreDisplay.innerText = Math.floor(score);
            speedDisplay.innerText = speedMultiplier.toFixed(1) + "x";

            player.update();
            spawnObstacle();
            
            obstacles.forEach(obs => {
                obs.update();
            });
            obstacles = obstacles.filter(obs => {
                if (obs.markedForDeletion) {
                    score += 10; // Bonus for passing obstacle
                    return false;
                }
                return true;
            });

            obstacleTimer += 16; // Approx 60fps
            
            checkCollisions();
        }

        function animate(timestamp) {
            if (!gameRunning && particles.length === 0) return; // Stop if game over and no particles
            
            update();
            draw();
            
            requestAnimationFrame(animate);
        }

        // Event Listeners
        startBtn.addEventListener('click', async () => {
            await initAudio();
            startMusic();
            startScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            initGame();
        });

        restartBtn.addEventListener('click', () => {
            gameOverScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            startMusic();
            initGame();
        });

        // Initial Draw
        resize();
        ctx.fillStyle = '#0f0f1a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
    </script>
</body>
</html>
