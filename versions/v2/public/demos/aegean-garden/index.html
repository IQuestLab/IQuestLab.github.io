<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>爱琴海花园 · 3D造景编辑器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
    }
  }
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="#/" class="nav-logo">
        <svg class="flower-icon" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="18" cy="10" r="5" fill="#C2185B" opacity="0.9"/>
          <circle cx="25" cy="16" r="5" fill="#E91E63" opacity="0.8"/>
          <circle cx="22" cy="24" r="5" fill="#C2185B" opacity="0.7"/>
          <circle cx="14" cy="24" r="5" fill="#E91E63" opacity="0.8"/>
          <circle cx="11" cy="16" r="5" fill="#C2185B" opacity="0.9"/>
          <circle cx="18" cy="17" r="3" fill="#FFD54F"/>
        </svg>
        <span class="logo-text">爱琴海花园</span>
      </a>
      <div class="nav-links">
        <a href="#/" class="nav-link active" data-page="catalog" id="nav-catalog">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          花卉目录
        </a>
        <a href="#/garden" class="nav-link" data-page="garden" id="nav-garden">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          花园场景
        </a>
      </div>
    </div>
  </nav>

  <!-- ═══════════ PAGE: CATALOG ═══════════ -->
  <div id="page-catalog" class="page active">
    <div class="catalog-hero">
      <div class="hero-content">
        <h1 class="hero-title">探索地中海花卉</h1>
        <p class="hero-subtitle">在白墙与蓝海之间，挑选属于你的那一丛色彩</p>
        <div class="search-wrap">
          <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="search-input" placeholder="搜索花卉名称…" autocomplete="off">
        </div>
        <div class="season-chips" id="season-chips">
          <button class="chip active" data-season="all">全部</button>
          <button class="chip" data-season="spring">🌸 春</button>
          <button class="chip" data-season="summer">☀️ 夏</button>
          <button class="chip" data-season="autumn">🍂 秋</button>
          <button class="chip" data-season="winter">❄️ 冬</button>
        </div>
      </div>
      <div class="hero-visual">
        <div class="hero-blob hero-blob-1"></div>
        <div class="hero-blob hero-blob-2"></div>
        <div class="hero-blob hero-blob-3"></div>
      </div>
    </div>
    <div class="catalog-grid" id="flower-grid">
      <!-- Cards injected by JS -->
    </div>
    <div class="catalog-empty" id="catalog-empty" style="display:none">
      <p>没有找到匹配的花卉</p>
      <button class="btn-chip" onclick="document.getElementById('search-input').value='';document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.season==='all'));window._filterCatalog()">清除筛选</button>
    </div>
  </div>

  <!-- ═══════════ PAGE: EDITOR ═══════════ -->
  <div id="page-editor" class="page">
    <div class="editor-layout">
      <aside class="editor-panel">
        <button class="btn-back" id="editor-back">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
          返回目录
        </button>
        <h2 class="panel-title">花朵编辑器</h2>

        <div class="preset-section">
          <h3 class="section-label">预设品种</h3>
          <div class="preset-list" id="preset-list">
            <!-- Injected by JS -->
          </div>
        </div>

        <div class="param-section">
          <h3 class="section-label">花瓣参数</h3>
          <div class="slider-group">
            <div class="slider-row">
              <label>花瓣数</label>
              <input type="range" id="p-petals" min="3" max="24" value="8">
              <span class="slider-val" id="v-petals">8</span>
            </div>
            <div class="slider-row">
              <label>卷边角度</label>
              <input type="range" id="p-curl" min="0" max="90" value="30">
              <span class="slider-val" id="v-curl">30°</span>
            </div>
            <div class="slider-row">
              <label>花瓣大小</label>
              <input type="range" id="p-size" min="30" max="150" value="80">
              <span class="slider-val" id="v-size">80</span>
            </div>
            <div class="slider-row">
              <label>茎干高度</label>
              <input type="range" id="p-stem" min="20" max="150" value="80">
              <span class="slider-val" id="v-stem">80</span>
            </div>
          </div>
        </div>

        <div class="param-section">
          <h3 class="section-label">颜色调整</h3>
          <div class="slider-row">
            <label>色相偏移</label>
            <input type="range" id="p-hue" min="0" max="360" value="0">
            <span class="slider-val" id="v-hue">0°</span>
          </div>
          <div class="hue-preview" id="hue-preview"></div>
        </div>

        <button class="btn-primary" id="btn-plant">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          种入花园
        </button>
      </aside>

      <div class="editor-preview">
        <canvas id="editor-canvas"></canvas>
        <div class="flower-bubble" id="flower-bubble">九重葛云</div>
      </div>
    </div>
  </div>

  <!-- ═══════════ PAGE: GARDEN ═══════════ -->
  <div id="page-garden" class="page">
    <div class="garden-layout">
      <aside class="garden-tools">
        <h2 class="panel-title">花园工具</h2>

        <div class="tool-section">
          <h3 class="section-label">花卉托盘</h3>
          <div class="tray-grid" id="tray-grid">
            <!-- Injected by JS -->
          </div>
        </div>

        <div class="tool-section">
          <h3 class="section-label">种植参数</h3>
          <div class="slider-row">
            <label>花朵尺寸</label>
            <input type="range" id="g-size" min="40" max="200" value="100">
            <span class="slider-val" id="v-gsize">100%</span>
          </div>
          <div class="slider-row">
            <label>色相偏移</label>
            <input type="range" id="g-hue" min="0" max="360" value="0">
            <span class="slider-val" id="v-ghue">0°</span>
          </div>
        </div>

        <div class="tool-section">
          <label class="toggle-wrap">
            <input type="checkbox" id="g-batch">
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
            <span class="toggle-label">批量框选种植</span>
          </label>
        </div>

        <div class="tool-section">
          <h3 class="section-label">日照时间轴</h3>
          <div class="slider-row">
            <label>时间</label>
            <input type="range" id="g-sun" min="6" max="18" step="0.5" value="12">
            <span class="slider-val" id="v-sun">12:00</span>
          </div>
          <div class="sun-labels">
            <span>清晨</span><span>正午</span><span>黄昏</span>
          </div>
        </div>

        <div class="tool-section">
          <h3 class="section-label">渲染风格</h3>
          <div class="select-wrap">
            <select id="g-style" class="styled-select">
              <option value="realistic">地中海写实</option>
              <option value="watercolor">水彩素描</option>
              <option value="mosaic">瓷砖马赛克</option>
            </select>
            <svg class="select-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
          </div>
        </div>

        <div class="tool-section tool-actions">
          <button class="btn-secondary" id="btn-clear">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
            清空花园
          </button>
          <div class="flower-count" id="flower-count">已种植 <strong>0</strong> 朵花</div>
        </div>
      </aside>

      <div class="garden-scene">
        <canvas id="garden-canvas"></canvas>
        <div class="garden-tooltip" id="garden-tooltip"></div>
        <div class="batch-hint" id="batch-hint" style="display:none">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 3v18"/></svg>
          拖拽框选区域，松开后批量种植
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
