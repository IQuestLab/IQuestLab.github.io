<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太空射击游戏 HUD 界面</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050510;
            overflow: hidden; /* Prevent scrollbars */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            width: 100%;
            height: 100%;
            max-width: 1600px; /* Allow it to scale up but not too huge */
            max-height: 900px;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.2);
        }

        /* 
           NOTE: Per instructions, NO CSS animations are applied to SVG elements.
           All motion is handled via JS or static states.
        */
        
        .text-label {
            font-family: 'Courier New', Courier, monospace;
            fill: #00ffff;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 5px #00ffff;
        }
        
        .text-label-enemy {
            font-family: 'Courier New', Courier, monospace;
            fill: #ff3333;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 0 0 5px #ff0000;
        }

        .hud-line {
            fill: none;
            stroke: #00ffff;
            stroke-width: 1;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <!-- Main SVG Container -->
    <svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" id="game-canvas">
        <defs>
            <!-- Glow Filter for Neon Effect -->
            <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
                <feMerge>
                    <feMergeNode in="coloredBlur"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>

            <!-- Grid Pattern -->
            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a2e" stroke-width="1"/>
            </pattern>

            <!-- Gradient for Health -->
            <linearGradient id="health-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#ff0055;stop-opacity:1" />
                <stop offset="50%" style="stop-color:#ff9900;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#00ffcc;stop-opacity:1" />
            </linearGradient>

            <!-- Gradient for Bar Background -->
            <linearGradient id="bar-bg" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#2a2a3a;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#1a1a25;stop-opacity:1" />
            </linearGradient>

            <!-- Scanline Pattern -->
            <pattern id="scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
                <rect x="0" y="0" width="4" height="2" fill="rgba(0,0,0,0.3)" />
            </pattern>
        </defs>

        <!-- 1. Background Layer -->
        <!-- Starry Background -->
        <rect width="800" height="450" fill="url(#grid)" />
        <g id="star-field"></g>
        
        <!-- Dark Vignette -->
        <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
            <stop offset="60%" stop-color="transparent"/>
            <stop offset="100%" stop-color="rgba(0,0,0,0.8)"/>
        </radialGradient>
        <rect width="800" height="450" fill="url(#vignette)" style="pointer-events: none;" />

        <!-- 2. Top HUD Area -->
        <!-- Top Header Text -->
        <text x="400" y="30" text-anchor="middle" class="text-label" style="font-size: 16px; fill: #ffffff; letter-spacing: 4px;">SYSTEM: ONLINE // SECTOR 7G</text>

        <!-- Radar Center -->
        <g transform="translate(700, 50)">
            <!-- Radar Base Circle -->
            <circle cx="0" cy="0" r="40" fill="#111" stroke="#333" stroke-width="2" />
            
            <!-- Radar Grid Lines -->
            <line x1="0" y1="-40" x2="0" y2="40" class="hud-line" />
            <line x1="-28" y1="-28" x2="28" y2="28" class="hud-line" />
            <line x1="28" y1="-28" x2="-28" y2="28" class="hud-line" />
            
            <!-- Circular Border -->
            <circle cx="0" cy="0" r="40" fill="none" stroke="#00ffff" stroke-width="1" stroke-opacity="0.5" />
            
            <!-- Radar Blips (Simulated) -->
            <circle cx="0" cy="-30" r="2" fill="#00ff00" />
            <circle cx="-30" cy="10" r="2" fill="#ffff00" />
            
            <!-- Sweeping Line (Rotated via JS) -->
            <g id="radar-sweep">
                <path d="M 0 0 L 35 -35 L 30 -30 Z" fill="#00ffff" fill-opacity="0.3" />
                <polygon points="-5 -35 35 -35 30 -30" fill="none" stroke="#00ffff" stroke-width="1" />
            </g>
        </g>

        <!-- Ammo Counter (Top Right) -->
        <g transform="translate(720, 100)">
            <text x="0" y="0" class="text-label" style="font-size: 10px;">WEAPON</text>
            <text x="0" y="25" class="text-label-enemy" style="font-size: 24px;">PLASMA</text>
            
            <!-- Ammo Visual -->
            <g transform="translate(0, 40)">
                <!-- Slots -->
                <rect x="0" y="0" width="10" height="20" fill="url(#bar-gradient)" stroke="#ff3333" stroke-width="1"/>
                <rect x="12" y="0" width="10" height="20" fill="url(#bar-gradient)" stroke="#ff3333" stroke-width="1"/>
                <rect x="24" y="0" width="10" height="20" fill="url(#bar-gradient)" stroke="#ff3333" stroke-width="1"/>
                <rect x="36" y="0" width="10" height="20" fill="url(#bar-gradient)" stroke="#ff3333" stroke-width="1"/>
                <rect x="48" y="0" width="10" height="20" fill="#ff3333" stroke="#ff3333" stroke-width="1"/> <!-- Active -->
                <rect x="60" y="0" width="10" height="20" fill="#331111" stroke="#00ff00" stroke-width="1"/>
                <rect x="72" y="0" width="10" height="20" fill="#331111" stroke="#00ff00" stroke-width="1"/>
            </g>
        </g>

        <!-- 3. Left Side HUD (Health) -->
        <g transform="translate(30, 100)">
            <text x="0" y="0" class="text-label" style="font-size: 12px;">HULL INTEGRITY</text>
            
            <!-- Bar Background -->
            <rect x="0" y="15" width="200" height="20" fill="url(#bar-bg)" stroke="#00ffff" stroke-width="1" />
            
            <!-- Health Fill -->
            <rect x="2" y="17" width="150" height="16" fill="url(#health-gradient)" filter="url(#neon-glow)" opacity="0.8" />
            
            <!-- Segment Markers -->
            <line x1="50" y1="15" x2="50" y2="35" stroke="#000" stroke-width="2"/>
            <line x1="100" y1="15" x2="100" y2="35" stroke="#000" stroke-width="2"/>
            <line x1="150" y1="15" x2="150" y2="35" stroke="#000" stroke-width="2"/>

            <!-- Shields Bar -->
            <text x="0" y="55" class="text-label" style="fill: #00aaff; font-size: 11px;">SHIELDS</text>
            <rect x="0" y="65" width="200" height="5" fill="#003355" stroke="#00aaff" stroke-width="0.5"/>
            <rect x="0" y="66" width="120" height="3" fill="#00aaff" filter="url(#neon-glow)"/>
        </g>

        <!-- 4. Central Enemy Locking System -->
        <g transform="translate(400, 225)">
            <!-- Outer Rotating Ring (Static for scope, but we can hint at tech) -->
            <circle cx="0" cy="0" r="90" fill="none" stroke="#1a1a2e" stroke-width="2" stroke-dasharray="10, 5" />
            
            <!-- Crosshair / Reticle -->
            <g id="target-lock" filter="url(#neon-glow)">
                <!-- Horizontal -->
                <line x1="-10" y1="-20" x2="10" y2="-20" stroke="#ff0055" stroke-width="2" />
                <line x1="-10" y1="20" x2="10" y2="20" stroke="#ff0055" stroke-width="2" />
                <!-- Vertical -->
                <line x1="-20" y1="-10" x2="-20" y2="10" stroke="#ff0055" stroke-width="2" />
                <line x1="20" y1="-10" x2="20" y2="10" stroke="#ff0055" stroke-width="2" />
                <!-- Center Dot -->
                <circle cx="0" cy="0" r="2" fill="#fff" />
                
                <!-- Range Brackets (Meters) -->
                <path d="M -40 60 L -30 60 L -30 65 L -40 65 Z" fill="#ff0055" opacity="0.7"/>
                <path d="M 30 60 L 40 60 L 40 65 L 30 65 Z" fill="#ff0055" opacity="0.7"/>
            </g>

            <!-- Enemy Silhouette (Inside Lock Box) -->
            <g id="enemy-view" transform="translate(0, 0) scale(0.6)">
                <!-- Enemy Ship Shape -->
                <path d="M 0 -30 L 20 10 L 10 25 L -10 25 L -20 10 Z" fill="#330000" stroke="#ff0000" stroke-width="2" />
                <!-- Engine Glow -->
                <path d="M -10 25 L 0 40 L 10 25 Z" fill="#ffaa00" />
                <!-- Health Bar above Enemy -->
                <rect x="-20" y="-50" width="40" height="4" fill="#222" />
                <rect x="-20" y="-50" width="30" height="4" fill="#ff0000" />
                <text x="0" y="-44" text-anchor="middle" fill="#ff0000" font-size="8" font-family="monospace">Target Locked</text>
            </g>
            
            <!-- Locking Status (Left and Right of center) -->
            <text x="-90" y="-80" text-anchor="start" fill="#ff0055" font-family="monospace" font-size="10" letter-spacing="2">ACQUIRING...</text>
            <text x="90" y="-80" text-anchor="end" fill="#ff0055" font-family="monospace" font-size="10" letter-spacing="2">LOCKED</text>
        </g>

        <!-- 5. Bottom Area (Player Ship & Controls) -->
        
        <!-- Engine Exhaust Glow -->
        <ellipse cx="400" cy="420" rx="60" ry="15" fill="url(#health-gradient)" filter="url(#neon-glow)" opacity="0.4" />

        <!-- Missile Pods -->
        <g transform="translate(320, 410)">
            <path d="M 0 0 L -15 -5 L -15 5 Z" fill="#555" stroke="#aaa" />
            <path d="M 0 0 L -10 -8 L -10 8 Z" fill="#333" /> <!-- Warhead -->
        </g>
        <g transform="translate(480, 410)">
            <path d="M 0 0 L -15 -5 L -15 5 Z" fill="#555" stroke="#aaa" />
            <path d="M 0 0 L -10 -8 L -10 8 Z" fill="#333" />
        </g>

        <!-- Main Ship Hull -->
        <path d="M 350 410 L 450 410 L 480 430 L 400 450 L 320 430 Z" fill="#1a1a2e" stroke="#00ffff" stroke-width="2" filter="url(#neon-glow)" />
        
        <!-- Thrusters -->
        <rect x="360" y="435" width="20" height="5" fill="#0088ff" />
        <rect x="420" y="435" width="20" height="5" fill="#0088ff" />

        <!-- Cockpit Window -->
        <path d="M 380 415 L 420 415 L 410 430 L 390 430 Z" fill="#000" stroke="#00ffff" stroke-width="1" opacity="0.8"/>
        <line x1="400" y1="415" x2="400" y2="430" stroke="#00ffff" stroke-width="1" opacity="0.5"/>

        <!-- Status Overlay -->
        <g transform="translate(250, 440)">
            <circle cx="10" cy="0" r="4" fill="#00ff00" />
            <text x="20" y="5" class="text-label" style="font-size: 10px;">NAV ACTIVE</text>
        </g>
        <g transform="translate(350, 440)">
            <circle cx="10" cy="0" r="4" fill="#ff0000" />
            <text x="20" y="5" class="text-label" style="fill: #ff0000; font-size: 10px;">ENG FAIL</text> <!-- Intentional error for retro feel -->
        </g>

        <!-- Decorative Corner Brackets -->
        <path d="M 20 20 L 50 20 L 50 22 L 22 22 Z" fill="#00ffff" opacity="0.3" />
        <path d="M 780 20 L 750 20 L 750 22 L 780 22 Z" fill="#00ffff" opacity="0.3" />
        <path d="M 20 430 L 50 430 L 50 428 L 22 428 Z" fill="#00ffff" opacity="0.3" />
        <path d="M 780 430 L 750 430 L 750 428 L 778 428 Z" fill="#00ffff" opacity="0.3" />

    </svg>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const svg = document.getElementById('game-canvas');
            const starField = document.getElementById('star-field');
            const radarSweep = document.getElementById('radar-sweep');
            const enemyView = document.getElementById('enemy-view');

            // 1. Generate Starfield (Static Geometry, moving with CSS transform on container or JS)
            // We will generate DOM elements for stars.
            const stars = [];
            const starCount = 100;
            
            for (let i = 0; i < starCount; i++) {
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                const x = Math.random() * 800;
                const y = Math.random() * 450;
                const r = Math.random() * 1.5;
                const opacity = Math.random();
                
                circle.setAttribute("cx", x);
                circle.setAttribute("cy", y);
                circle.setAttribute("r", r);
                circle.setAttribute("fill", "#ffffff");
                circle.setAttribute("opacity", opacity);
                
                starField.appendChild(circle);
                
                stars.push({
                    el: circle,
                    x: x,
                    y: y,
                    speed: Math.random() * 0.5 + 0.1,
                    baseX: x,
                    baseY: y
                });
            }

            // 2. Radar Animation Logic (JS driven, no CSS animation on SVG)
            let radarAngle = 0;
            function animateRadar() {
                radarAngle = (radarAngle + 2) % 360; // Rotate 360 degrees
                
                // Use transform attribute directly
                radarSweep.setAttribute("transform", `rotate(${radarAngle})`);
                requestAnimationFrame(animateRadar);
            }
            animateRadar();

            // 3. Background Parallax Starfield Animation
            // Move stars slowly to simulate space speed
            function animateStars() {
                stars.forEach(star => {
                    star.y += star.speed;
                    if (star.y > 450) {
                        star.y = 0;
                        star.x = Math.random() * 800; // Randomize x on reset
                    }
                    star.el.setAttribute("cy", star.y);
                    
                    // Subtle twinkle
                    if (Math.random() > 0.98) {
                        star.el.setAttribute("opacity", Math.random());
                    }
                });
                requestAnimationFrame(animateStars);
            }
            animateStars();

            // 4. Enemy View Zoom/Scan Effect (Simulating the crosshair looking around)
            // We will oscillate the center of the enemy-view group slightly
            let scanTime = 0;
            function animateScan() {
                scanTime += 0.02;
                const offsetX = Math.sin(scanTime) * 2;
                const offsetY = Math.cos(scanTime) * 2;
                enemyView.setAttribute("transform", `translate(${offsetX}, ${offsetY}) scale(0.6)`);
                requestAnimationFrame(animateScan);
            }
            animateScan();
        });
    </script>
</body>
</html>
