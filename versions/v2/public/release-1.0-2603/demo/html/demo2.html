<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Visualization - AI Thinker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; color: #e0e0e0; font-family: 'Courier New', Courier, monospace; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        .glass-panel {
            background: rgba(10, 10, 15, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .tech-border {
            border: 1px solid rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 5px rgba(0, 255, 255, 0.1), inset 0 0 10px rgba(0, 255, 255, 0.05);
        }

        .scanline {
            width: 100%;
            height: 100px;
            z-index: 10;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(0, 255, 255, 0.05) 50%, rgba(0,0,0,0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scanline 10s linear infinite;
            pointer-events: none;
        }

        @keyframes scanline {
            0% { bottom: 100%; }
            100% { bottom: -100%; }
        }

        .glitch {
            position: relative;
            color: #0ff;
        }
        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .glitch::before {
            left: 2px;
            text-shadow: -1px 0 red;
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }
        .glitch::after {
            left: -2px;
            text-shadow: -1px 0 blue;
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }
        @keyframes glitch-anim {
            0% { clip: rect(13px, 9999px, 8px, 0); }
            20% { clip: rect(6px, 9999px, 86px, 0); }
            40% { clip: rect(12px, 9999px, 3px, 0); }
            60% { clip: rect(58px, 9999px, 16px, 0); }
            80% { clip: rect(27px, 9999px, 88px, 0); }
            100% { clip: rect(91px, 9999px, 13px, 0); }
        }
        @keyframes glitch-anim-2 {
            0% { clip: rect(28px, 9999px, 96px, 0); }
            20% { clip: rect(6px, 9999px, 16px, 0); }
            40% { clip: rect(87px, 9999px, 11px, 0); }
            60% { clip: rect(28px, 9999px, 58px, 0); }
            80% { clip: rect(12px, 9999px, 99px, 0); }
            100% { clip: rect(46px, 9999px, 77px, 0); }
        }

        #waveform-canvas {
            position: fixed;
            bottom: 80px;
            right: 24px;
            z-index: 30;
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(10, 10, 15, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.08);
        }
        #waveform-label {
            position: fixed;
            bottom: 188px;
            right: 24px;
            z-index: 31;
            font-size: 9px;
            color: rgba(0, 255, 255, 0.5);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div class="scanline"></div>

    <!-- Waveform overlay -->
    <div id="waveform-label">NETWORK ACTIVITY</div>
    <canvas id="waveform-canvas" width="220" height="100"></canvas>

    <!-- UI Overlay -->
    <div class="absolute top-0 left-0 w-full h-full z-20 pointer-events-none flex flex-col justify-between p-6">

        <!-- Header -->
        <header class="flex justify-between items-start pointer-events-auto">
            <div class="glass-panel tech-border p-4 rounded-lg max-w-md">
                <h1 class="text-2xl font-bold mb-1 glitch" data-text="NEURAL_NET.V7">NEURAL_NET.V7</h1>
                <p class="text-xs text-cyan-400 font-mono">SYSTEM_STATUS: <span id="system-status" class="animate-pulse text-green-400">ONLINE</span></p>
                <p class="text-xs text-gray-400 mt-2">Nodes: <span id="node-count">0</span> | Signals: <span id="signal-count">0</span> | Particles: <span id="particle-count">0</span></p>
            </div>

            <div class="glass-panel tech-border p-2 rounded-lg">
                <button id="reset-btn" class="bg-gray-800 hover:bg-gray-700 text-cyan-400 border border-cyan-900 px-4 py-2 rounded text-xs font-bold transition-all flex items-center gap-2">
                    <span>&#8634;</span> REGENERATE STRUCTURE
                </button>
            </div>
        </header>

        <!-- Info Panel -->
        <div id="info-panel" class="absolute left-6 top-1/2 transform -translate-y-1/2 w-64 glass-panel tech-border rounded-lg p-4 translate-x-[-150%] transition-transform duration-300 pointer-events-auto"
             onmouseenter="onInfoPanelEnter()" onmouseleave="onInfoPanelLeave()">
            <div class="flex justify-between items-center mb-3 border-b border-gray-700 pb-2">
                <span class="text-cyan-300 text-sm font-bold">NODE_DATA</span>
                <div class="w-2 h-2 bg-green-500 rounded-full shadow-[0_0_10px_#0f0]"></div>
            </div>
            <div class="space-y-3 text-xs font-mono">
                <div>
                    <span class="text-gray-500">ID:</span> <span id="info-id" class="text-white">--</span>
                </div>
                <div>
                    <span class="text-gray-500">LAYER:</span> <span id="info-layer" class="text-purple-400">--</span>
                </div>
                <div>
                    <span class="text-gray-500">WEIGHT:</span> <span id="info-weight" class="text-yellow-400">--</span>
                </div>
                <div>
                    <span class="text-gray-500">ACTIVITY:</span>
                    <div id="info-activity" class="w-full bg-gray-800 h-2 mt-1 rounded overflow-hidden">
                        <div class="bg-cyan-500 h-full transition-all duration-200" style="width: 0%"></div>
                    </div>
                </div>
                <div class="pt-2">
                    <p class="text-gray-300 text-[10px] leading-tight">
                        State: <span id="info-state" class="text-green-400">IDLE</span><br>
                        Connections: <span id="info-connections" class="text-blue-400">0</span>
                    </p>
                </div>
            </div>
            <div class="mt-4 flex gap-2">
                <button id="boost-btn" class="flex-1 bg-cyan-900/50 hover:bg-cyan-700/50 text-cyan-300 text-[10px] py-1 rounded border border-cyan-700 transition-colors">BOOST</button>
                <button id="mute-btn" class="flex-1 bg-red-900/50 hover:bg-red-700/50 text-red-300 text-[10px] py-1 rounded border border-red-700 transition-colors">HALT</button>
            </div>
        </div>

        <!-- Footer Controls -->
        <footer class="flex justify-between items-end pointer-events-auto">
            <div class="glass-panel tech-border p-3 rounded-lg max-w-xs">
                <div class="flex items-center gap-3 mb-2">
                    <label class="text-[10px] text-gray-400 font-bold uppercase">Simulation Speed</label>
                    <input type="range" id="speed-control" min="0.1" max="3" step="0.1" value="1" class="w-full accent-cyan-500 h-1 bg-gray-800 rounded-lg appearance-none cursor-pointer">
                </div>
                <div class="flex gap-2">
                    <button id="pause-btn" class="flex-1 bg-gray-800 hover:bg-gray-700 text-white text-xs py-2 rounded border border-gray-600">PAUSE</button>
                    <div class="w-px bg-gray-600 my-0"></div>
                    <button id="activate-all-btn" class="flex-1 bg-gray-800 hover:bg-gray-700 text-cyan-400 text-xs py-2 rounded border border-gray-600">FIRE ALL</button>
                </div>
            </div>

            <div class="glass-panel tech-border p-4 rounded-lg">
                <h3 class="text-[10px] text-gray-500 uppercase tracking-widest mb-1">Legend</h3>
                <div class="flex flex-col gap-1 text-[10px]">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full bg-cyan-400 shadow-[0_0_8px_#0ff]"></div> Input
                        <div class="w-2 h-2 rounded-full bg-blue-500 shadow-[0_0_8px_#44f]"></div> Hidden 1
                        <div class="w-2 h-2 rounded-full bg-purple-500 shadow-[0_0_8px_#a0f]"></div> Hidden 2
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full bg-pink-500 shadow-[0_0_8px_#f0a]"></div> Hidden 3
                        <div class="w-2 h-2 rounded-full bg-rose-400 shadow-[0_0_8px_#f4a]"></div> Output
                        <div class="w-1 h-1 rounded-full bg-white shadow-[0_0_4px_#fff]"></div> Signal
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <script>
        // ==========================================================
        // CONFIGURATION
        // ==========================================================
        const LAYER_CONFIG = [
            { name: 'Input',    count: 6,  x: -18, color: new THREE.Color(0x00e5ff), emissive: new THREE.Color(0x006688) },
            { name: 'Hidden 1', count: 10, x: -9,  color: new THREE.Color(0x4488ff), emissive: new THREE.Color(0x2244aa) },
            { name: 'Hidden 2', count: 12, x: 0,   color: new THREE.Color(0x9944ff), emissive: new THREE.Color(0x5522aa) },
            { name: 'Hidden 3', count: 10, x: 9,   color: new THREE.Color(0xdd44cc), emissive: new THREE.Color(0x882288) },
            { name: 'Output',   count: 4,  x: 18,  color: new THREE.Color(0xff4488), emissive: new THREE.Color(0xaa2244) },
        ];

        const CONFIG = {
            nodeRadius: 0.55,
            colors: {
                bg: 0x050508,
                connection: 0x1a2a4a,
                connectionActive: 0x4488ff,
            },
            dustCount: 600,
            particlePoolSize: 200,
            particleSpeed: 12.0,
        };

        // ==========================================================
        // STATE
        // ==========================================================
        let scene, camera, renderer, controls;
        let nodes = [];
        let connections = [];
        let clock = new THREE.Clock();
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let hoveredNode = null;
        let isMouseOverPanel = false;
        let panelHideTimeout = null;
        let pinnedNode = null; // node whose info is shown in the panel
        let isPaused = false;
        let simulationSpeed = 1.0;
        let time = 0;
        let animationId;

        // Particle pool for signals
        let particlePool = [];
        let activeParticles = [];

        // Dust system
        let dustSystem = null;

        // Waveform data
        const waveformData = [];
        const WAVEFORM_LENGTH = 220;
        for (let i = 0; i < WAVEFORM_LENGTH; i++) waveformData.push(0);

        // Shared geometries and textures (created once)
        let sharedNodeGeometry;
        let glowTexture;
        let particleTexture;

        // ==========================================================
        // TEXTURE GENERATORS
        // ==========================================================
        function createGlowTexture() {
            const size = 128;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.15, 'rgba(255,255,255,0.6)');
            gradient.addColorStop(0.4, 'rgba(128,180,255,0.15)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            const tex = new THREE.CanvasTexture(canvas);
            return tex;
        }

        function createParticleTexture() {
            const size = 32;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.3, 'rgba(255,255,255,0.4)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            return new THREE.CanvasTexture(canvas);
        }

        // ==========================================================
        // NODE CLASS
        // ==========================================================
        class Node {
            constructor(id, x, y, z, layerIndex, layerConfig) {
                this.id = id;
                this.layerIndex = layerIndex;
                this.layerName = layerConfig.name;
                this.layerColor = layerConfig.color.clone();
                this.layerEmissive = layerConfig.emissive.clone();
                this.position = new THREE.Vector3(x, y, z);
                this.activity = 0;
                this.pulse = Math.random() * Math.PI * 2;
                this.pulseSpeed = 1.5 + Math.random() * 1.0;
                this.forwardNeighbors = [];  // nodes in next layer
                this.backwardNeighbors = []; // nodes in previous layer
                this.outConnections = [];    // Connection objects going forward

                // Node mesh
                this.material = new THREE.MeshStandardMaterial({
                    color: this.layerEmissive.clone().multiplyScalar(0.3),
                    emissive: new THREE.Color(0x000000),
                    roughness: 0.3,
                    metalness: 0.9,
                    transparent: true,
                    opacity: 1.0,
                });

                this.mesh = new THREE.Mesh(sharedNodeGeometry, this.material);
                this.mesh.position.copy(this.position);
                this.mesh.userData = { nodeRef: this };

                // Glow sprite
                this.glowMaterial = new THREE.SpriteMaterial({
                    map: glowTexture,
                    color: this.layerColor,
                    transparent: true,
                    opacity: 0.0,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                });
                this.glowSprite = new THREE.Sprite(this.glowMaterial);
                this.glowSprite.scale.set(4.0, 4.0, 1);
                this.mesh.add(this.glowSprite);

                // Ring indicator
                const ringGeom = new THREE.RingGeometry(CONFIG.nodeRadius * 1.3, CONFIG.nodeRadius * 1.6, 32);
                this.ringMaterial = new THREE.MeshBasicMaterial({
                    color: this.layerColor,
                    transparent: true,
                    opacity: 0.0,
                    side: THREE.DoubleSide,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                });
                this.ring = new THREE.Mesh(ringGeom, this.ringMaterial);
                this.ring.lookAt(camera.position);
                this.mesh.add(this.ring);

                scene.add(this.mesh);
            }

            update(dt) {
                // Decay activity
                if (this.activity > 0) {
                    this.activity -= dt * 0.6;
                    if (this.activity < 0) this.activity = 0;
                }

                // Pulse
                this.pulse += dt * this.pulseSpeed;

                // Base idle pulse
                const idlePulse = 0.05 + Math.sin(this.pulse) * 0.03;

                // Emissive intensity from activity
                const intensity = Math.max(idlePulse, this.activity);

                // Color lerp: dim -> layer color based on intensity
                const dimColor = new THREE.Color(0x080810);
                this.material.color.copy(dimColor).lerp(this.layerEmissive, intensity * 0.5);
                this.material.emissive.copy(this.layerColor).multiplyScalar(intensity * 0.8);
                this.material.emissiveIntensity = intensity * 2.0;

                // Scale pulse when active
                const s = 1.0 + this.activity * 0.3 * Math.sin(this.pulse * 3);
                this.mesh.scale.setScalar(s);

                // Glow sprite
                this.glowMaterial.opacity = intensity * 0.6;
                const glowScale = 3.0 + intensity * 3.0;
                this.glowSprite.scale.set(glowScale, glowScale, 1);

                // Ring
                this.ringMaterial.opacity = this.activity * 0.4;
                this.ring.rotation.z += dt * 0.5;
                this.ring.lookAt(camera.position);
            }

            activate(strength) {
                if (strength === undefined) strength = 1.0;
                this.activity = Math.min(1.0, Math.max(this.activity, strength));

                // Spawn signal particles to forward neighbors
                if (strength > 0.15) {
                    this.forwardNeighbors.forEach(neighbor => {
                        if (Math.random() < 0.6 + strength * 0.3) {
                            spawnSignalParticle(this, neighbor, strength);
                        }
                    });
                }
            }

            // Called when a signal arrives at this node
            receiveSignal(strength) {
                const received = strength * (0.5 + Math.random() * 0.4);
                this.activate(received);
            }

            dispose() {
                this.material.dispose();
                this.glowMaterial.dispose();
                this.ringMaterial.dispose();
                this.ring.geometry.dispose();
                scene.remove(this.mesh);
            }
        }

        // ==========================================================
        // CONNECTION CLASS
        // ==========================================================
        class Connection {
            constructor(nodeA, nodeB) {
                this.nodeA = nodeA;
                this.nodeB = nodeB;
                this.pulseProgress = -1; // -1 = no pulse, 0..1 = pulse traveling

                // Line with segments for glow pulse effect
                const segCount = 20;
                const positions = new Float32Array(segCount * 3);
                const colors = new Float32Array(segCount * 3);

                for (let i = 0; i < segCount; i++) {
                    const t = i / (segCount - 1);
                    positions[i * 3]     = THREE.MathUtils.lerp(nodeA.position.x, nodeB.position.x, t);
                    positions[i * 3 + 1] = THREE.MathUtils.lerp(nodeA.position.y, nodeB.position.y, t);
                    positions[i * 3 + 2] = THREE.MathUtils.lerp(nodeA.position.z, nodeB.position.z, t);
                    colors[i * 3] = 0.1;
                    colors[i * 3 + 1] = 0.15;
                    colors[i * 3 + 2] = 0.25;
                }

                this.segCount = segCount;
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                this.material = new THREE.LineBasicMaterial({
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.2,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                });

                this.mesh = new THREE.Line(geometry, this.material);
                scene.add(this.mesh);
            }

            triggerPulse() {
                this.pulseProgress = 0;
            }

            update(dt) {
                const avgActivity = (this.nodeA.activity + this.nodeB.activity) / 2;
                this.material.opacity = 0.06 + avgActivity * 0.5;

                // Base color from layer lerp
                const cA = this.nodeA.layerColor;
                const cB = this.nodeB.layerColor;
                const colAttr = this.mesh.geometry.attributes.color;

                for (let i = 0; i < this.segCount; i++) {
                    const t = i / (this.segCount - 1);
                    // Lerp between the two node colors
                    const r = THREE.MathUtils.lerp(cA.r, cB.r, t) * 0.3;
                    const g = THREE.MathUtils.lerp(cA.g, cB.g, t) * 0.3;
                    const b = THREE.MathUtils.lerp(cA.b, cB.b, t) * 0.3;

                    // Pulse glow effect traveling along the line
                    let pulseIntensity = 0;
                    if (this.pulseProgress >= 0) {
                        const dist = Math.abs(t - this.pulseProgress);
                        pulseIntensity = Math.max(0, 1.0 - dist * 6.0);
                    }

                    // Activity-based brightness
                    const actBright = avgActivity * 0.5;

                    colAttr.array[i * 3]     = Math.min(1, r + actBright * cA.r + pulseIntensity * 1.0);
                    colAttr.array[i * 3 + 1] = Math.min(1, g + actBright * 0.5 * (cA.g + cB.g) + pulseIntensity * 0.8);
                    colAttr.array[i * 3 + 2] = Math.min(1, b + actBright * cB.b + pulseIntensity * 1.0);
                }
                colAttr.needsUpdate = true;

                // Advance pulse
                if (this.pulseProgress >= 0) {
                    this.pulseProgress += dt * 2.5;
                    if (this.pulseProgress > 1.2) {
                        this.pulseProgress = -1;
                    }
                }
            }

            dispose() {
                this.mesh.geometry.dispose();
                this.material.dispose();
                scene.remove(this.mesh);
            }
        }

        // ==========================================================
        // SIGNAL PARTICLE SYSTEM
        // ==========================================================
        function initParticlePool() {
            particlePool = [];
            activeParticles = [];

            for (let i = 0; i < CONFIG.particlePoolSize; i++) {
                const mat = new THREE.SpriteMaterial({
                    map: particleTexture,
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                });
                const sprite = new THREE.Sprite(mat);
                sprite.scale.set(0.5, 0.5, 1);
                sprite.visible = false;
                scene.add(sprite);

                particlePool.push({
                    sprite: sprite,
                    material: mat,
                    active: false,
                    source: null,
                    target: null,
                    progress: 0,
                    speed: 1,
                    strength: 1,
                    color: new THREE.Color(1, 1, 1),
                    connection: null,
                    pulseFired: false,
                });
            }
        }

        function spawnSignalParticle(sourceNode, targetNode, strength) {
            // Find a free particle
            let particle = null;
            for (let i = 0; i < particlePool.length; i++) {
                if (!particlePool[i].active) {
                    particle = particlePool[i];
                    break;
                }
            }
            if (!particle) return; // pool exhausted

            particle.active = true;
            particle.source = sourceNode;
            particle.target = targetNode;
            particle.progress = 0;
            particle.speed = CONFIG.particleSpeed * (0.7 + Math.random() * 0.6);
            particle.strength = strength;
            particle.color.copy(sourceNode.layerColor);
            particle.material.color.copy(particle.color);
            particle.material.opacity = 0.9;
            particle.sprite.visible = true;
            particle.sprite.position.copy(sourceNode.position);
            particle.pulseFired = false;

            // Find connection and trigger pulse
            const conn = sourceNode.outConnections.find(c => c.nodeB === targetNode);
            particle.connection = conn || null;
            if (conn) {
                conn.triggerPulse();
            }

            // Scale based on strength
            const s = 0.4 + strength * 0.6;
            particle.sprite.scale.set(s, s, 1);

            activeParticles.push(particle);
        }

        function updateParticles(dt) {
            for (let i = activeParticles.length - 1; i >= 0; i--) {
                const p = activeParticles[i];
                if (!p.active) {
                    activeParticles.splice(i, 1);
                    continue;
                }

                // Distance between source and target
                const totalDist = p.source.position.distanceTo(p.target.position);
                p.progress += (p.speed * dt) / totalDist;

                if (p.progress >= 1.0) {
                    // Arrived at target
                    p.target.receiveSignal(p.strength);
                    p.active = false;
                    p.sprite.visible = false;
                    activeParticles.splice(i, 1);
                    continue;
                }

                // Position along line with slight arc
                const t = p.progress;
                const src = p.source.position;
                const tgt = p.target.position;

                // Slight upward arc
                const arcHeight = 0.8 * Math.sin(t * Math.PI);
                const perpY = arcHeight;

                p.sprite.position.lerpVectors(src, tgt, t);
                p.sprite.position.y += perpY;

                // Fade out near end
                if (t > 0.7) {
                    p.material.opacity = (1.0 - t) / 0.3 * 0.9;
                } else {
                    p.material.opacity = 0.9;
                }

                // Slight size oscillation
                const sz = (0.4 + p.strength * 0.6) * (1.0 + Math.sin(t * 12) * 0.15);
                p.sprite.scale.set(sz, sz, 1);
            }
        }

        // ==========================================================
        // DUST PARTICLE SYSTEM
        // ==========================================================
        function createDustSystem() {
            const count = CONFIG.dustCount;
            const positions = new Float32Array(count * 3);
            const velocities = new Float32Array(count * 3);
            const opacities = new Float32Array(count);

            const range = 50;
            for (let i = 0; i < count; i++) {
                positions[i * 3]     = (Math.random() - 0.5) * range * 2;
                positions[i * 3 + 1] = (Math.random() - 0.5) * range * 2;
                positions[i * 3 + 2] = (Math.random() - 0.5) * range * 2;

                velocities[i * 3]     = (Math.random() - 0.5) * 0.3;
                velocities[i * 3 + 1] = (Math.random() - 0.5) * 0.2;
                velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.3;

                opacities[i] = Math.random();
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const dustTexture = createParticleTexture();
            const material = new THREE.PointsMaterial({
                map: dustTexture,
                size: 0.3,
                transparent: true,
                opacity: 0.25,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                color: 0x8899bb,
            });

            const points = new THREE.Points(geometry, material);
            scene.add(points);

            dustSystem = {
                mesh: points,
                positions: positions,
                velocities: velocities,
                opacities: opacities,
                count: count,
                range: range,
            };
        }

        function updateDust(dt) {
            if (!dustSystem) return;
            const d = dustSystem;
            const posAttr = d.mesh.geometry.attributes.position;

            for (let i = 0; i < d.count; i++) {
                d.positions[i * 3]     += d.velocities[i * 3] * dt;
                d.positions[i * 3 + 1] += d.velocities[i * 3 + 1] * dt;
                d.positions[i * 3 + 2] += d.velocities[i * 3 + 2] * dt;

                // Wrap around
                for (let j = 0; j < 3; j++) {
                    if (d.positions[i * 3 + j] > d.range) d.positions[i * 3 + j] = -d.range;
                    if (d.positions[i * 3 + j] < -d.range) d.positions[i * 3 + j] = d.range;
                }
            }

            posAttr.needsUpdate = true;
        }

        // ==========================================================
        // NETWORK CREATION
        // ==========================================================
        function createNetwork() {
            // Cleanup existing
            nodes.forEach(n => n.dispose());
            connections.forEach(c => c.dispose());
            nodes = [];
            connections = [];

            // Clean particle pool
            activeParticles.forEach(p => {
                p.active = false;
                p.sprite.visible = false;
            });
            activeParticles = [];

            let idCounter = 0;

            // Create layers
            LAYER_CONFIG.forEach((layerCfg, layerIdx) => {
                const count = layerCfg.count;
                const x = layerCfg.x;

                for (let i = 0; i < count; i++) {
                    // Spread nodes vertically in a circle-like arrangement
                    const verticalSpread = (count - 1) * 2.5;
                    const y = (i - (count - 1) / 2) * 2.5;

                    // Slight z offset for depth, using a sinusoidal pattern
                    const zAngle = (i / count) * Math.PI * 2;
                    const z = Math.sin(zAngle) * 2.0;

                    const node = new Node(idCounter++, x, y, z, layerIdx, layerCfg);
                    nodes.push(node);
                }
            });

            // Connect adjacent layers
            for (let li = 0; li < LAYER_CONFIG.length - 1; li++) {
                const currentLayerNodes = nodes.filter(n => n.layerIndex === li);
                const nextLayerNodes = nodes.filter(n => n.layerIndex === li + 1);

                currentLayerNodes.forEach(srcNode => {
                    nextLayerNodes.forEach(tgtNode => {
                        // Connect with distance-based probability
                        const dist = srcNode.position.distanceTo(tgtNode.position);
                        const maxDist = 20;
                        // Higher probability for closer nodes, but always some minimum
                        const prob = Math.max(0.3, 1.0 - (dist / maxDist));

                        if (Math.random() < prob) {
                            const conn = new Connection(srcNode, tgtNode);
                            connections.push(conn);
                            srcNode.forwardNeighbors.push(tgtNode);
                            srcNode.outConnections.push(conn);
                            tgtNode.backwardNeighbors.push(srcNode);
                        }
                    });
                });

                // Ensure every node has at least one connection
                currentLayerNodes.forEach(srcNode => {
                    if (srcNode.forwardNeighbors.length === 0) {
                        // Connect to closest node in next layer
                        let closest = nextLayerNodes[0];
                        let closestDist = Infinity;
                        nextLayerNodes.forEach(n => {
                            const d = srcNode.position.distanceTo(n.position);
                            if (d < closestDist) { closestDist = d; closest = n; }
                        });
                        const conn = new Connection(srcNode, closest);
                        connections.push(conn);
                        srcNode.forwardNeighbors.push(closest);
                        srcNode.outConnections.push(conn);
                        closest.backwardNeighbors.push(srcNode);
                    }
                });

                nextLayerNodes.forEach(tgtNode => {
                    if (tgtNode.backwardNeighbors.length === 0) {
                        let closest = currentLayerNodes[0];
                        let closestDist = Infinity;
                        currentLayerNodes.forEach(n => {
                            const d = tgtNode.position.distanceTo(n.position);
                            if (d < closestDist) { closestDist = d; closest = n; }
                        });
                        const conn = new Connection(closest, tgtNode);
                        connections.push(conn);
                        closest.forwardNeighbors.push(tgtNode);
                        closest.outConnections.push(conn);
                        tgtNode.backwardNeighbors.push(closest);
                    }
                });
            }
        }

        // ==========================================================
        // CLICK TO ACTIVATE (Raycaster)
        // ==========================================================
        function onMouseClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const meshes = nodes.map(n => n.mesh);
            const intersects = raycaster.intersectObjects(meshes, false);

            if (intersects.length > 0) {
                const clickedMesh = intersects[0].object;
                const node = clickedMesh.userData.nodeRef;
                if (node) {
                    triggerCascade(node);
                }
            }
        }

        function triggerCascade(startNode) {
            // Activate the clicked node
            startNode.activate(1.0);

            // Also fire backward (for visual effect if clicking mid-network)
            startNode.backwardNeighbors.forEach(n => {
                setTimeout(() => {
                    n.activate(0.6);
                }, 100);
            });
        }

        // ==========================================================
        // HOVER (Raycaster)
        // ==========================================================
        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const meshes = nodes.map(n => n.mesh);
            const intersects = raycaster.intersectObjects(meshes, false);

            if (intersects.length > 0) {
                const mesh = intersects[0].object;
                const node = mesh.userData.nodeRef;

                if (node && node !== hoveredNode) {
                    hoveredNode = node;
                    pinnedNode = node;
                    document.body.style.cursor = 'pointer';
                    // Cancel any pending hide
                    if (panelHideTimeout) {
                        clearTimeout(panelHideTimeout);
                        panelHideTimeout = null;
                    }
                    showInfoPanel(node);
                    controls.autoRotate = false;
                }
            } else {
                if (hoveredNode) {
                    hoveredNode = null;
                    document.body.style.cursor = 'default';
                    // Delay hiding to allow mouse to reach the panel
                    if (!isMouseOverPanel) {
                        scheduleHidePanel();
                    }
                    controls.autoRotate = true;
                }
            }
        }

        function scheduleHidePanel() {
            if (panelHideTimeout) clearTimeout(panelHideTimeout);
            panelHideTimeout = setTimeout(() => {
                if (!isMouseOverPanel && !hoveredNode) {
                    hideInfoPanel();
                    pinnedNode = null;
                }
                panelHideTimeout = null;
            }, 400);
        }

        function onInfoPanelEnter() {
            isMouseOverPanel = true;
            if (panelHideTimeout) {
                clearTimeout(panelHideTimeout);
                panelHideTimeout = null;
            }
        }

        function onInfoPanelLeave() {
            isMouseOverPanel = false;
            if (!hoveredNode) {
                scheduleHidePanel();
            }
        }

        function showInfoPanel(node) {
            const panel = document.getElementById('info-panel');
            panel.style.transform = 'translateX(0%)';

            document.getElementById('info-id').innerText = 'N-' + String(node.id).padStart(3, '0');
            document.getElementById('info-layer').innerText = node.layerName + ' (L' + node.layerIndex + ')';
            document.getElementById('info-weight').innerText = (Math.random() * 100).toFixed(2) + ' GHz';
            document.getElementById('info-activity').children[0].style.width = (node.activity * 100) + '%';
            document.getElementById('info-connections').innerText = (node.forwardNeighbors.length + node.backwardNeighbors.length);

            const stateEl = document.getElementById('info-state');
            if (node.activity > 0.6) {
                stateEl.innerText = "FIRING";
                stateEl.className = "text-red-400 font-bold animate-pulse";
            } else if (node.activity > 0.1) {
                stateEl.innerText = "ACTIVE";
                stateEl.className = "text-yellow-400";
            } else {
                stateEl.innerText = "IDLE";
                stateEl.className = "text-cyan-400";
            }
        }

        function hideInfoPanel() {
            document.getElementById('info-panel').style.transform = 'translateX(-150%)';
        }

        // ==========================================================
        // WAVEFORM CANVAS (2D overlay)
        // ==========================================================
        function updateWaveform() {
            const activeCount = nodes.filter(n => n.activity > 0.15).length;
            const normalized = nodes.length > 0 ? activeCount / nodes.length : 0;
            waveformData.push(normalized);
            if (waveformData.length > WAVEFORM_LENGTH) waveformData.shift();

            const canvas = document.getElementById('waveform-canvas');
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;

            ctx.clearRect(0, 0, w, h);

            // Background grid
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.06)';
            ctx.lineWidth = 0.5;
            for (let y = 0; y < h; y += 20) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
                ctx.stroke();
            }
            for (let x = 0; x < w; x += 20) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, h);
                ctx.stroke();
            }

            // Waveform fill gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, h);
            gradient.addColorStop(0, 'rgba(0, 255, 255, 0.3)');
            gradient.addColorStop(0.5, 'rgba(100, 50, 255, 0.15)');
            gradient.addColorStop(1, 'rgba(255, 0, 128, 0.05)');

            ctx.beginPath();
            ctx.moveTo(0, h);

            for (let i = 0; i < waveformData.length; i++) {
                const x = (i / (WAVEFORM_LENGTH - 1)) * w;
                const y = h - waveformData[i] * h * 0.9 - 2;
                if (i === 0) {
                    ctx.lineTo(x, y);
                } else {
                    // Smooth curve
                    const prevX = ((i - 1) / (WAVEFORM_LENGTH - 1)) * w;
                    const prevY = h - waveformData[i - 1] * h * 0.9 - 2;
                    const cpx = (prevX + x) / 2;
                    ctx.quadraticCurveTo(prevX, prevY, cpx, (prevY + y) / 2);
                }
            }

            const lastX = w;
            const lastY = h - waveformData[waveformData.length - 1] * h * 0.9 - 2;
            ctx.lineTo(lastX, lastY);
            ctx.lineTo(w, h);
            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.fill();

            // Waveform line
            ctx.beginPath();
            for (let i = 0; i < waveformData.length; i++) {
                const x = (i / (WAVEFORM_LENGTH - 1)) * w;
                const y = h - waveformData[i] * h * 0.9 - 2;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.8)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Current value dot
            const dotX = w - 1;
            const dotY = h - waveformData[waveformData.length - 1] * h * 0.9 - 2;
            ctx.beginPath();
            ctx.arc(dotX, dotY, 3, 0, Math.PI * 2);
            ctx.fillStyle = '#0ff';
            ctx.shadowColor = '#0ff';
            ctx.shadowBlur = 8;
            ctx.fill();
            ctx.shadowBlur = 0;

            // Text
            ctx.font = '9px Courier New';
            ctx.fillStyle = 'rgba(0, 255, 255, 0.5)';
            ctx.fillText(Math.round(normalized * 100) + '% active', 5, 12);
        }

        // ==========================================================
        // INITIALIZATION
        // ==========================================================
        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(CONFIG.colors.bg);
            scene.fog = new THREE.FogExp2(CONFIG.colors.bg, 0.008);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
            camera.position.set(5, 12, 40);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.4;
            controls.target.set(0, 0, 0);
            controls.minDistance = 15;
            controls.maxDistance = 80;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x303040, 1.5);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xaabbcc, 0.8);
            dirLight.position.set(15, 25, 15);
            scene.add(dirLight);

            const cyanLight = new THREE.PointLight(0x00ffff, 1.5, 60);
            cyanLight.position.set(-20, 5, 0);
            scene.add(cyanLight);

            const purpleLight = new THREE.PointLight(0x8844ff, 1.5, 60);
            purpleLight.position.set(0, 5, 10);
            scene.add(purpleLight);

            const pinkLight = new THREE.PointLight(0xff4488, 1.2, 60);
            pinkLight.position.set(20, 5, 0);
            scene.add(pinkLight);

            // Grid helper
            const gridHelper = new THREE.GridHelper(80, 40, 0x0a1530, 0x060e20);
            gridHelper.position.y = -20;
            scene.add(gridHelper);

            // Create shared resources
            sharedNodeGeometry = new THREE.SphereGeometry(CONFIG.nodeRadius, 20, 20);
            glowTexture = createGlowTexture();
            particleTexture = createParticleTexture();

            // Build network
            createNetwork();

            // Create particle pool
            initParticlePool();

            // Create dust system
            createDustSystem();

            // Event listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('click', onMouseClick);

            // Start loop
            animate();
            setInterval(updateStats, 500);
            setInterval(updateWaveform, 100);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ==========================================================
        // ANIMATION LOOP
        // ==========================================================
        function animate() {
            animationId = requestAnimationFrame(animate);

            const rawDelta = clock.getDelta();
            const dt = Math.min(rawDelta, 0.05) * simulationSpeed;
            time += dt;

            if (!isPaused) {
                // Update nodes
                nodes.forEach(node => node.update(dt));

                // Update connections
                connections.forEach(conn => conn.update(dt));

                // Update signal particles
                updateParticles(dt);

                // Update dust
                updateDust(rawDelta * 0.5);

                // Random spontaneous activation on input layer
                if (Math.random() < 0.04 * simulationSpeed) {
                    const inputNodes = nodes.filter(n => n.layerIndex === 0);
                    if (inputNodes.length > 0) {
                        const target = inputNodes[Math.floor(Math.random() * inputNodes.length)];
                        target.activate(0.7 + Math.random() * 0.3);
                    }
                }

                // Occasional deeper layer spontaneous activity (rare)
                if (Math.random() < 0.008 * simulationSpeed) {
                    const midNodes = nodes.filter(n => n.layerIndex > 0 && n.layerIndex < LAYER_CONFIG.length - 1);
                    if (midNodes.length > 0) {
                        const target = midNodes[Math.floor(Math.random() * midNodes.length)];
                        target.activate(0.4 + Math.random() * 0.3);
                    }
                }

                // Update info panel in real-time if hovered
                const activeInfoNode = hoveredNode || pinnedNode;
                if (activeInfoNode) {
                    document.getElementById('info-activity').children[0].style.width = (activeInfoNode.activity * 100) + '%';
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // ==========================================================
        // UI EVENT HANDLERS
        // ==========================================================
        document.getElementById('reset-btn').addEventListener('click', () => {
            createNetwork();
            const status = document.getElementById('system-status');
            status.innerText = "RECONFIGURING...";
            status.className = "animate-pulse text-yellow-400";
            setTimeout(() => {
                status.innerText = "ONLINE";
                status.className = "animate-pulse text-green-400";
            }, 1200);
        });

        document.getElementById('pause-btn').addEventListener('click', function() {
            isPaused = !isPaused;
            this.innerText = isPaused ? "RESUME" : "PAUSE";
            this.classList.toggle('bg-red-700');
            this.classList.toggle('bg-gray-800');
            const status = document.getElementById('system-status');
            if (isPaused) {
                status.innerText = "PAUSED";
                status.className = "text-yellow-400";
            } else {
                status.innerText = "ONLINE";
                status.className = "animate-pulse text-green-400";
            }
        });

        document.getElementById('activate-all-btn').addEventListener('click', function() {
            // Fire all input nodes simultaneously
            const inputNodes = nodes.filter(n => n.layerIndex === 0);
            inputNodes.forEach((node, i) => {
                setTimeout(() => {
                    node.activate(1.0);
                }, i * 50);
            });
            this.classList.add('bg-cyan-700');
            setTimeout(() => this.classList.remove('bg-cyan-700'), 500);
        });

        document.getElementById('boost-btn').addEventListener('click', function() {
            const target = hoveredNode || pinnedNode;
            if (target) {
                target.activate(1.0);
            }
        });

        document.getElementById('mute-btn').addEventListener('click', function() {
            const target = hoveredNode || pinnedNode;
            if (target) {
                target.activity = 0;
            }
        });

        document.getElementById('speed-control').addEventListener('input', (e) => {
            simulationSpeed = parseFloat(e.target.value);
            controls.autoRotateSpeed = simulationSpeed * 0.4;
        });

        function updateStats() {
            const activeCount = nodes.filter(n => n.activity > 0.15).length;
            document.getElementById('node-count').innerText = nodes.length;
            document.getElementById('signal-count').innerText = activeCount;
            document.getElementById('particle-count').innerText = activeParticles.length;
        }

        // ==========================================================
        // START
        // ==========================================================
        init();

    </script>
</body>
